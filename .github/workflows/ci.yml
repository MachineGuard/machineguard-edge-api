name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Pruebas unitarias y BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install --require-hashes -r requirements-test.txt

      - name: Ejecutar pruebas (pytest + pytest-bdd)
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/junit.xml --cucumberjson=reports/cucumber.json

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/security-check.py secrets --report reports/secrets.json
      - run: python scripts/security-check.py dependencies --requirements requirements-test.txt --report reports/dependencies.json

  integration:
    name: PostgreSQL real y Edge-Core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mgci
          POSTGRES_DB: mgci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U mgci -d mgci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: edge
          persist-credentials: false
      - name: Require access to the private companion repository
        env:
          COMPANION_TOKEN: ${{ secrets.MACHINEGUARD_CI_READ_TOKEN }}
        run: test -n "$COMPANION_TOKEN" || { echo 'Configure a read-only companion repository token'; exit 1; }
      - uses: actions/checkout@v7
        with:
          repository: MachineGuard/machineguard-core-api
          ref: 599151dc6995ef211f42f8b54133eb59cbe40d00
          path: core
          token: ${{ secrets.MACHINEGUARD_CI_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core/pom.xml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r edge/requirements-test.txt
      - run: psql -h 127.0.0.1 -U mgci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mgci_test'
      - name: Run the same local integration commands without skipping live tests
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/mgci
          MACHINEGUARD_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/mgci_test
          DB_USERNAME: mgci
          DB_PASSWORD: ''
        run: python edge/scripts/edge-core-integration.py --core core --edge edge --report reports/integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-reports
          path: reports/
          if-no-files-found: error
